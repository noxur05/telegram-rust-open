[package]
name = "telegram-happ-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.48.0", features = ["full"] }
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-native-tls", "with-rust_decimal"] }
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"] }
base64 = "0.21"
serde_json = "1.0"
rust_decimal = "1.33"